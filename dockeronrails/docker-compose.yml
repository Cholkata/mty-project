services:
  rails:
    build: ./rails/backend
    command: bundle exec rails server -b '0.0.0.0'
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE} 
    volumes:
      - rails_tmp:/rails/tmp
      - rails_storage:/rails/storage
    ports:
      - "3000:3000"
    tmpfs:
      - /tmp
  node:
    build: ./node
    environment:
      - NODE_ENV=development
    volumes:
      - ./node:/app
      - /app/node_modules
      - node_logs:/app/logs
    ports:
      - "3001:3001"

volumes:
  rails_tmp:
  rails_storage:
  node_logs:

